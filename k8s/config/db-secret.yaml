# DUMMY credentials for the capstone — NEVER commit real secrets to git.
# (Production answer: Sealed Secrets / SOPS / an external secrets manager.)
# stringData lets us write plain values; K8s base64-encodes them on apply.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: employee-app
type: Opaque
stringData:
  # --- consumed by the backend (Spring relaxed binding) ---
  SPRING_DATASOURCE_USERNAME: employee
  SPRING_DATASOURCE_PASSWORD: employeepass
  # --- consumed by the mysql container on first init ---
  MYSQL_ROOT_PASSWORD: rootpass
  MYSQL_DATABASE: employeedb
  MYSQL_USER: employee
  MYSQL_PASSWORD: employeepass
