# Backend (Spring Boot) — stateless, 2 replicas, config from ConfigMap + Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: employee-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: likith0129/employee-backend:1.0.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: app-config     # datasource URL, redis host/port, CORS
            - secretRef:
                name: db-secret      # DB username/password
          # requests/limits for scheduling + HPA (Project 3.2).
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits:   { cpu: "500m", memory: "1Gi" }
          # Spring Boot Actuator exposes these probe endpoints.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
